name: Validate integration
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate release version and docs
        run: python scripts/check_version.py
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Check JavaScript syntax and allocation regressions
        run: |
          node --check custom_components/smartify_flow_card/frontend/smartify-flow-card.js
          node tests/test_power_allocation.cjs
