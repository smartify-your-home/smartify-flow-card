name: Validate integration
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate release version and docs
        run: python scripts/check_version.py
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Check JavaScript syntax and allocation regressions
        run: |
          node --check custom_components/smartify_flow_card/frontend/smartify-flow-card.js
          node tests/test_power_allocation.cjs
          node tests/test_badge_layout.cjs
          node tests/test_list_sort.cjs
          node tests/test_font_scale.cjs
          node tests/test_radial_stability.cjs
          node tests/test_source_order.cjs
          node tests/test_consumer_modal.cjs
          node tests/test_picker_types.cjs
          node tests/test_allocation_visuals.cjs
          node tests/test_historical_view.cjs
          node tests/test_historical_balance.cjs
          node tests/test_historical_periods.cjs
          node tests/test_pv_plants.cjs
          node tests/test_history_flow_transitions.cjs
          node tests/test_editor_sections.cjs
          node tests/test_monthly_peaks_ui.cjs
          node tests/test_house_energy_sensor_ui.cjs
